apiVersion: apps/v1
kind: Deployment
metadata:
  name: kronos-consumer-audit
  labels:
    {{- include "kronos.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.consumerAudit.replicas }}
  selector:
    matchLabels:
      app: kronos-consumer-audit
  template:
    metadata:
      labels:
        app: kronos-consumer-audit
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.28
          command: ['sh', '-c', 'until nslookup kronos-kafka.default.svc.cluster.local; do echo waiting for kafka; sleep 2; done']
      containers:
        - name: consumer-audit
          image: "{{ .Values.consumerAudit.image }}:{{ .Values.consumerAudit.tag }}"
          imagePullPolicy: Never
          args: ["-kafka-broker={{ .Values.kafka.broker }}"]